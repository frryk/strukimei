<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struk POS & Generator Struk IMEI - T Mobile</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧾</text></svg>">
    
    <!-- html2canvas untuk konversi HTML struk ke gambar PNG & print thermal bitmap -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <!-- JsBarcode untuk rendering barcode batang standar (Code 128 / Code 39) -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</head>

<body>
    <!-- HEADER & TOOLBAR UTAMA -->
    <header class="no-print app-header">
        <div class="header-inner">
            <div class="brand">
                <div class="brand-icon">🧾</div>
                <div class="brand-info">
                    <h1>Struk POS & IMEI</h1>
                    <span class="badge-pro">PRO v2.0</span>
                </div>
            </div>

            <!-- Toolbar Kontrol Cepat -->
            <div class="header-controls">
                <div class="control-item">
                    <label for="template-select">Template:</label>
                    <select id="template-select">
                        <option value="tmobile-imei" selected>📱 T-Mobile / Handphone (IMEI)</option>
                        <option value="modern-80">🏪 Struk Retail 80mm</option>
                        <option value="standard-58">🧾 Struk Kasir 58mm</option>
                        <option value="cafe-minimalist">☕ Struk Kafe / F&B</option>
                    </select>
                </div>

                <div class="control-item">
                    <label>Ukuran Kertas:</label>
                    <div class="segmented-control" id="paper-width-switch">
                        <button type="button" class="seg-btn" data-width="w-58">58mm</button>
                        <button type="button" class="seg-btn active" data-width="w-80">80mm</button>
                    </div>
                </div>

                <div class="control-item">
                    <label for="connection-select">Metode Cetak:</label>
                    <select id="connection-select">
                        <option value="system">🖨️ Dialog Cetak Sistem (PC/HP/Mac)</option>
                        <option value="usb">🔌 Kabel USB Direct ESC/POS</option>
                        <option value="bluetooth">📶 Bluetooth Direct ESC/POS</option>
                    </select>
                </div>
            </div>

            <!-- Tombol Aksi Utama -->
            <div class="header-actions">
                <button id="btn-print" class="btn btn-primary" title="Cetak struk ke printer">
                    <span class="btn-icon">🖨️</span> Cetak Struk
                </button>
                <button id="btn-save-img" class="btn btn-secondary" title="Simpan sebagai file gambar PNG resolusi tinggi">
                    <span class="btn-icon">📥</span> Simpan PNG
                </button>
                <button id="btn-wa" class="btn btn-whatsapp" title="Kirim rincian struk ke WhatsApp pelanggan">
                    <span class="btn-icon">💬</span> Kirim WA
                </button>
                <button id="btn-copy-text" class="btn btn-ghost" title="Salin format teks struk ke clipboard">
                    <span class="btn-icon">📋</span> Salin
                </button>
                <button id="btn-reset" class="btn btn-ghost" title="Muat ulang data template default T-Mobile">
                    <span class="btn-icon">🔄</span> Reset
                </button>
            </div>
        </div>

        <!-- Segmented Tab untuk Tampilan Mobile -->
        <div class="mobile-tab-bar">
            <button type="button" class="mobile-tab active" data-tab="editor">
                ✏️ Form Edit Struk
            </button>
            <button type="button" class="mobile-tab" data-tab="preview">
                👁️ Preview Struk
            </button>
        </div>
    </header>

    <!-- KONTEN UTAMA: SPLIT VIEW (EDITOR KIRI, PREVIEW KANAN) -->
    <main class="app-container">
        <!-- PANEL FORMULIR EDITOR (KIRI) -->
        <section class="editor-pane" id="editor-pane">
            <div class="editor-header">
                <h2>✏️ Editor Data Struk</h2>
                <div class="editor-header-actions">
                    <button type="button" id="btn-sample-tmobile" class="btn-sm btn-outline">
                        Gunakan Data Contoh T-Mobile
                    </button>
                    <label class="toggle-switch" title="Aktifkan klik langsung untuk mengedit teks di struk preview">
                        <input type="checkbox" id="check-inline-edit">
                        <span class="slider"></span>
                        <span class="toggle-label">Edit Langsung di Struk</span>
                    </label>
                </div>
            </div>

            <!-- ACCORDION / SECTIONS -->
            <!-- 1. INFORMASI TOKO -->
            <div class="editor-card">
                <div class="card-title">
                    <span class="card-icon">🏪</span>
                    <h3>Informasi Toko & Header</h3>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-12">
                            <label for="input-store-name">Nama Toko / Perusahaan</label>
                            <input type="text" id="input-store-name" placeholder="T MOBILE">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-12">
                            <label for="input-roc-no">Nomor Registrasi / ROC</label>
                            <input type="text" id="input-roc-no" placeholder="ROC no.2025593844m">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-6">
                            <label for="input-address-1">Alamat Baris 1</label>
                            <input type="text" id="input-address-1" placeholder="513 Bishan St. 13,">
                        </div>
                        <div class="form-group col-6">
                            <label for="input-address-2">Alamat Baris 2 (Kota/Kode Pos)</label>
                            <input type="text" id="input-address-2" placeholder="#01-502 Singapore 570513">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-6">
                            <label for="input-store-tel">No. Telepon</label>
                            <input type="text" id="input-store-tel" placeholder="8376 6999">
                        </div>
                        <div class="form-group col-6">
                            <label for="input-store-email">Email Toko</label>
                            <input type="text" id="input-store-email" placeholder="atmobile5g@gmail.com">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. DETAIL TRANSAKSI -->
            <div class="editor-card">
                <div class="card-title">
                    <span class="card-icon">📄</span>
                    <h3>Detail Nomor Faktur & Transaksi</h3>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-6">
                            <label for="input-bill-number">Bill Number (No. Faktur)</label>
                            <input type="text" id="input-bill-number" placeholder="0362393">
                        </div>
                        <div class="form-group col-6">
                            <label for="input-cashier">Kasir / Nama Counter</label>
                            <input type="text" id="input-cashier" placeholder="AT Mobile">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-6">
                            <div class="label-with-action">
                                <label for="input-date">Tanggal</label>
                                <button type="button" id="btn-today" class="btn-text">Hari ini</button>
                            </div>
                            <input type="text" id="input-date" placeholder="02-10-2026">
                        </div>
                        <div class="form-group col-6">
                            <div class="label-with-action">
                                <label for="input-time">Waktu</label>
                                <button type="button" id="btn-now" class="btn-text">Sekarang</button>
                            </div>
                            <input type="text" id="input-time" placeholder="14:35">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. DAFTAR PRODUK & IMEI -->
            <div class="editor-card">
                <div class="card-title-between">
                    <div class="card-title">
                        <span class="card-icon">📱</span>
                        <h3>Produk, Spesifikasi & Daftar IMEI</h3>
                    </div>
                    <button type="button" id="btn-add-item" class="btn-sm btn-primary">
                        + Tambah Produk
                    </button>
                </div>
                <div class="card-body">
                    <div id="items-editor-container" class="items-editor-container">
                        <!-- Kartu produk di-render secara dinamis oleh JavaScript -->
                    </div>
                </div>
            </div>

            <!-- 4. PEMBAYARAN & PELANGGAN -->
            <div class="editor-card">
                <div class="card-title">
                    <span class="card-icon">💰</span>
                    <h3>Pembayaran & Pelanggan</h3>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-4">
                            <label for="input-currency">Simbol Mata Uang</label>
                            <select id="input-currency">
                                <option value="$" selected>$ (Dollar)</option>
                                <option value="Rp ">Rp (Rupiah)</option>
                                <option value="S$">S$ (SGD)</option>
                                <option value="RM ">RM (Ringgit)</option>
                            </select>
                        </div>
                        <div class="form-group col-4">
                            <label for="input-total-amount">Total Amount</label>
                            <input type="number" id="input-total-amount" step="0.01" placeholder="700.00">
                        </div>
                        <div class="form-group col-4">
                            <label for="input-cash">Cash (Uang Diterima)</label>
                            <input type="number" id="input-cash" step="0.01" placeholder="700.00">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-4">
                            <label for="input-customer">Customer (Nama Pelanggan)</label>
                            <input type="text" id="input-customer" placeholder="*BELLA">
                        </div>
                        <div class="form-group col-4">
                            <label for="input-balance">Balance (Kembalian)</label>
                            <input type="number" id="input-balance" step="0.01" placeholder="0.00">
                        </div>
                        <div class="form-group col-4">
                            <label for="input-bill-id">Bill ID (Untuk Barcode)</label>
                            <input type="text" id="input-bill-id" placeholder="AT-965377">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-12">
                            <label for="input-customer-phone">No. WhatsApp Pelanggan (Untuk tombol Kirim WA)</label>
                            <input type="text" id="input-customer-phone" placeholder="Contoh: 6583766999 atau 08123456789">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 5. FOOTER & PENGATURAN STRUK -->
            <div class="editor-card">
                <div class="card-title">
                    <span class="card-icon">⚙️</span>
                    <h3>Footer & Pengaturan Barcode</h3>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-12">
                            <label for="input-footer-text">Teks Ucapan Terima Kasih (Footer)</label>
                            <input type="text" id="input-footer-text" placeholder="Thanks for The Purchase">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-12 checkbox-group">
                            <label class="custom-checkbox">
                                <input type="checkbox" id="check-show-barcode" checked>
                                <span class="checkmark"></span>
                                <strong>Cetak Barcode Batang Bill ID di bagian bawah struk</strong>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- PANEL PREVIEW STRUK (KANAN) -->
        <section class="preview-pane" id="preview-pane">
            <div class="preview-sticky-wrap">
                <!-- Info Status Bar Preview -->
                <div class="preview-toolbar no-print">
                    <div class="preview-meta">
                        <span class="indicator-dot"></span>
                        <span class="meta-label">Live Preview Struk</span>
                        <span class="meta-badge" id="badge-paper-size">80mm Paper</span>
                    </div>
                    <div class="preview-controls">
                        <button type="button" id="btn-quick-print" class="btn-xs btn-primary" title="Cetak langsung struk">
                            🖨️ Cetak
                        </button>
                    </div>
                </div>

                <!-- ALAS KERTAS STRUK THERMAL -->
                <div class="receipt-wrapper">
                    <!-- Gerigi Kertas Atas (Tear Top) -->
                    <div class="receipt-tear-top no-print"></div>

                    <!-- ELEMEN STRUK UTAMA -->
                    <div id="receipt-container" class="receipt-paper w-80">
                        <!-- Diisi secara dinamis oleh app.js -->
                    </div>

                    <!-- Gerigi Kertas Bawah (Tear Bottom) -->
                    <div class="receipt-tear-bottom no-print"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- NOTIFIKASI TOAST -->
    <div id="toast" class="toast"></div>

    <!-- Script Utama Aplikasi -->
    <script type="module" src="app.js"></script>
</body>

</html>
